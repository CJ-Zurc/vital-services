name: VITAL Services CI/CD

on:
  push:
    branches: ["development", "staging", "main", "master"]
  pull_request:
    branches: ["development", "staging", "main", "master"]
  workflow_dispatch:
    inputs:
      eda_action:
        description: 'Separate EDA operation; never deploys or activates flags'
        type: choice
        default: none
        options: [none, publish-candidate, runtime-acceptance]
      root_sha:
        description: 'Reviewed Capstone_BGH full commit SHA for disposable checks'
        type: string
      api_image:
        description: 'Published EDA runtime ghcr.io/cj-zurc/vital-services@sha256 digest'
        type: string
      web_image:
        description: 'Published ghcr.io/cj-zurc/vital-web@sha256 digest'
        type: string
      web_sha:
        description: 'Compatible published Web full SHA; required for runtime, overrides VITAL_EDA_COMPATIBLE_WEB_SHA for route review'
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vital-services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

jobs:
  eda-paired-route-review:
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main' || github.base_ref == 'master')) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/development')
    name: Paired Services/Web static route review (not runtime parity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      web_sha: ${{ steps.source.outputs.web_sha }}
    steps:
      - name: Resolve matching Web development or staging revision
        id: paired-web
        if: >-
          (github.event_name == 'push' &&
            (github.ref_name == 'development' || github.ref_name == 'staging')) ||
          (github.event_name == 'pull_request' &&
            (github.event.pull_request.base.ref == 'development' || github.event.pull_request.base.ref == 'staging'))
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          # A development -> staging promotion must review the companion source being promoted.
          # Feature PRs still pair with their target branch; pushes pair with the pushed branch.
          WEB_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref == 'staging' && github.head_ref == 'development' && 'development' || github.event.pull_request.base.ref || github.ref_name }}
          WEB_SHA_OVERRIDE: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' && vars[format('VITAL_EDA_PR_{0}_WEB_SHA', github.event.pull_request.number)] || '' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_PAT:?GH_PAT is required to read the private VITAL Web repository}"
          : "${WEB_BRANCH:?Could not resolve the paired VITAL Web branch}"
          [[ "$WEB_BRANCH" =~ ^(development|staging)$ ]]
          # An explicit PR-specific companion does not affect other PRs or releases.
          if [[ -n "$WEB_SHA_OVERRIDE" ]]; then
            if [[ ! "$WEB_SHA_OVERRIDE" =~ ^[a-f0-9]{40}$ ]]; then
              echo 'The PR-specific Web revision must be a full commit SHA.' >&2
              exit 1
            fi
            echo "web_sha=$WEB_SHA_OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using the explicit companion Web commit: $WEB_SHA_OVERRIDE"
            exit 0
          fi
          response="$(curl --fail --silent --show-error \
            --config <(printf 'header = "Authorization: Bearer %s"\n' "$GH_PAT") \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/CJ-Zurc/vital-web/git/ref/heads/${WEB_BRANCH}")"
          web_sha="$(jq -er '.object.sha' <<<"$response")"
          [[ "$web_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "web_sha=$web_sha" >> "$GITHUB_OUTPUT"

      - name: Require explicit compatible published Web SHA
        shell: bash
        env:
          WEB_SHA: ${{ steps.paired-web.outputs.web_sha || inputs.web_sha || vars.VITAL_EDA_COMPATIBLE_WEB_SHA }}
        run: |
          if [[ ! "$WEB_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Set web_sha or VITAL_EDA_COMPATIBLE_WEB_SHA to a reviewed published full Web SHA.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: vital-services
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CJ-Zurc/vital-web
          ref: ${{ steps.paired-web.outputs.web_sha || inputs.web_sha || vars.VITAL_EDA_COMPATIBLE_WEB_SHA }}
          token: ${{ secrets.GH_PAT || secrets.VITAL_EDA_SOURCE_READ_TOKEN || github.token }}
          path: vital-web
          persist-credentials: false
      - name: Verify exact paired source
        id: source
        shell: bash
        env:
          WEB_SHA: ${{ steps.paired-web.outputs.web_sha || inputs.web_sha || vars.VITAL_EDA_COMPATIBLE_WEB_SHA }}
        run: |
          test "$(git -C vital-web rev-parse HEAD)" = "$WEB_SHA"
          test "$(git -C vital-services rev-parse HEAD)" = "$GITHUB_SHA"
          echo "web_sha=$WEB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vital-services/package-lock.json
      - run: npm ci
        working-directory: vital-services
      - name: Review all paired source route contracts
        working-directory: vital-services
        env:
          EDA_TEST_ENABLED: 'false'
        run: |
          set -o pipefail
          node --import tsx --test test/contracts/route-contracts.test.ts 2>&1 | tee ../vital-paired-route-review.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vital-paired-route-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: vital-paired-route-review.tap
          if-no-files-found: warn

  eda-publish-candidate:
    name: Publish EDA candidate only (no deployment)
    needs: [lint-and-test, eda-paired-route-review]
    if: >-
      !cancelled() && needs.lint-and-test.result == 'success' && needs.eda-paired-route-review.result == 'success' && (github.event_name == 'workflow_dispatch' && inputs.eda_action == 'publish-candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          EDA_TEST_ENABLED: 'false'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: eda
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cj-zurc/vital-services:eda-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
      - uses: docker/build-push-action@v5
        id: eda-tools
        with:
          context: .
          file: Dockerfile
          target: tools
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cj-zurc/vital-services-tools:eda-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
      - name: Record runtime and separate tools image (not acceptance)
        env:
          DIGEST: ${{ steps.eda.outputs.digest }}
          TOOLS_DIGEST: ${{ steps.eda-tools.outputs.digest }}
          REVIEWED_WEB_SHA: ${{ needs.eda-paired-route-review.outputs.web_sha }}
        run: |
          node -e 'require("fs").writeFileSync("eda-candidate.json", JSON.stringify({source:process.env.GITHUB_SHA,reviewedWebSource:process.env.REVIEWED_WEB_SHA,api:`ghcr.io/cj-zurc/vital-services@${process.env.DIGEST}`,worker:`ghcr.io/cj-zurc/vital-services@${process.env.DIGEST}`,tools:`ghcr.io/cj-zurc/vital-services-tools@${process.env.TOOLS_DIGEST}`,runtimeAcceptance:"notexecuted",activation:false},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: vital-services-eda-candidate-${{ github.sha }}
          path: eda-candidate.json

  eda-runtime-acceptance:
    name: Enabled API/worker, native TLS storage and Unix scanner (not staging)
    needs: [lint-and-test, eda-crossservice-contracts]
    if: >-
      !cancelled() && needs.lint-and-test.result == 'success' && needs.eda-crossservice-contracts.result == 'success' && (github.event_name == 'workflow_dispatch' && inputs.eda_action == 'runtime-acceptance')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      ROOT_SHA: ${{ inputs.root_sha }}
      WEB_SHA: ${{ inputs.web_sha }}
      API_IMAGE: ${{ inputs.api_image }}
      WEB_IMAGE: ${{ inputs.web_image }}
    steps:
      - name: Require immutable inputs
        run: |
          [[ "$ROOT_SHA" =~ ^[a-f0-9]{40}$ && "$WEB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$API_IMAGE" =~ ^ghcr.io/cj-zurc/vital-services@sha256:[a-f0-9]{64}$ ]]
          [[ "$WEB_IMAGE" =~ ^ghcr.io/cj-zurc/vital-web@sha256:[a-f0-9]{64}$ ]]
      - uses: actions/checkout@v4
        with:
          path: vital-services
      - uses: actions/checkout@v4
        with:
          repository: Capstone-BGH/Capstone_BGH
          ref: ${{ inputs.root_sha }}
          token: ${{ secrets.GH_PAT || secrets.VITAL_EDA_SOURCE_READ_TOKEN || github.token }}
          path: release-root
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: CJ-Zurc/vital-web
          ref: ${{ inputs.web_sha }}
          token: ${{ secrets.GH_PAT || secrets.VITAL_EDA_SOURCE_READ_TOKEN || github.token }}
          path: vital-web
          persist-credentials: false
      - name: Install existing workflow YAML parser dependencies
        working-directory: vital-services
        run: npm ci
      - name: Nonmutating release, environment and isolation contracts
        run: node --test release-root/scripts/vital-env-preflight.test.mjs
      - name: Disposable enabled runtime and native storage/scanner contracts
        run: bash release-root/scripts/ci-vital-runtime.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vital-eda-runtime-pending-${{ github.run_id }}
          path: vital-runtime-evidence.json
          if-no-files-found: error

  eda-crossservice-contracts:
    name: BFF/owner contract regressions (simulated external transports)
    needs: [lint-and-test]
    if: >-
      !cancelled() && needs.lint-and-test.result == 'success' && (github.event_name == 'workflow_dispatch' && inputs.eda_action == 'runtime-acceptance')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require reviewed immutable source
        env:
          WEB_SHA: ${{ inputs.web_sha }}
          ROOT_SHA: ${{ inputs.root_sha }}
        run: '[[ "$WEB_SHA" =~ ^[a-f0-9]{40}$ && "$ROOT_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: CJ-Zurc/vital-web
          ref: ${{ inputs.web_sha }}
          token: ${{ secrets.GH_PAT || secrets.VITAL_EDA_SOURCE_READ_TOKEN || github.token }}
          path: vital-web
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
        working-directory: vital-web
      - name: Existing Web/BFF integration contracts, not live central-service evidence
        working-directory: vital-web
        run: |
          set -o pipefail
          node --import tsx --test --test-concurrency=1 tests/eda-profile.test.ts tests/eda-public-registration.test.ts tests/eda-records.test.ts tests/eda-payment.test.ts tests/eda-video-transport.test.ts tests/eda-sse.test.ts 2>&1 | tee ../vital-contract-results.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vital-simulated-crossservice-contracts-${{ github.run_id }}
          path: vital-contract-results.tap
          if-no-files-found: error

  eda-domain-runtime:
    name: Real isolated PostgreSQL/RabbitMQ domain and crash-recovery scenarios
    needs: [lint-and-test, eda-crossservice-contracts]
    if: >-
      !cancelled() && needs.lint-and-test.result == 'success' && needs.eda-crossservice-contracts.result == 'success' && (github.event_name == 'workflow_dispatch' && inputs.eda_action == 'runtime-acceptance')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing actual DB/broker/mTLS suites with explicit owner opt-ins
        env:
          EDA_TEST_VIDEO_ENABLED: 'true'
          EDA_TEST_MESSAGING_ENABLED: 'true'
          EDA_TEST_RECORDS_ENABLED: 'true'
          # Storage/scanner transport runs in the separate native runtime job.
          EDA_TEST_RECORDS_ARTIFACTS_ENABLED: 'false'
        run: |
          set -o pipefail
          bash docker/eda/run-integration.sh 2>&1 | tee vital-domain-results.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vital-real-domain-runtime-simulated-providers-${{ github.run_id }}
          path: vital-domain-results.tap
          if-no-files-found: error

  eda-browser-smoke:
    name: Source-built browser layout smoke (not authenticated lifecycle acceptance)
    needs: [lint-and-test, eda-crossservice-contracts]
    if: >-
      !cancelled() && needs.lint-and-test.result == 'success' && needs.eda-crossservice-contracts.result == 'success' && (github.event_name == 'workflow_dispatch' && inputs.eda_action == 'runtime-acceptance')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WEB_SHA: ${{ inputs.web_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Capstone-BGH/Capstone_BGH
          ref: ${{ inputs.root_sha }}
          token: ${{ secrets.GH_PAT || secrets.VITAL_EDA_SOURCE_READ_TOKEN || github.token }}
          path: release-root
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CJ-Zurc/vital-web
          ref: ${{ inputs.web_sha }}
          token: ${{ secrets.GH_PAT || secrets.VITAL_EDA_SOURCE_READ_TOKEN || github.token }}
          path: vital-web
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
        working-directory: vital-web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: vital-web
      - run: pnpm run build
        working-directory: vital-web
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3137
          NEXT_PUBLIC_API_GATEWAY_URL: http://127.0.0.1:1
          NEXT_PUBLIC_SYSTEM_SLUG: vital
      - run: node release-root/release/vital/ci-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vital-browser-smoke-${{ github.run_id }}
          path: |
            vital-browser-evidence.json
            vital-login-*.png
          if-no-files-found: error

  # Keep the existing check name required; development runs fast checks, promotions run the full suite.
  fast-checks:
    name: Fast development checks
    if: (github.event_name == 'pull_request' && github.base_ref == 'development') || (github.event_name == 'push' && github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  lint-and-test:
    name: Unit Tests and Linting
    needs:
      - fast-checks
      - full-regression
    if: always() && ((github.event_name == 'pull_request' && github.base_ref == 'development') || (github.event_name == 'push' && github.ref == 'refs/heads/development') || (github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main' || github.base_ref == 'master')) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/development'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected verification tier to pass
        env:
          FAST_RESULT: ${{ needs.fast-checks.result }}
          FULL_RESULT: ${{ needs.full-regression.result }}
          FULL_REQUIRED: ${{ (github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main' || github.base_ref == 'master')) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/development') }}
        run: |
          if [ "$FULL_REQUIRED" = true ]; then
            test "$FULL_RESULT" = success && test "$FAST_RESULT" = skipped
          else
            test "$FAST_RESULT" = success && test "$FULL_RESULT" = skipped
          fi
    outputs:
      run_ci: ${{ needs.full-regression.result == 'success' }}

  full-regression:
    name: Full promotion regression
    outputs:
      run_ci: ${{ steps.ci-gate.outputs.run }}
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main' || github.base_ref == 'master')) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/development')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable full regression steps
        id: ci-gate
        run: echo 'run=true' >> "$GITHUB_OUTPUT"

      - name: Enforce branch flow
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = staging ] && [ "$HEAD" != development ]; then
            echo 'Only development can be merged into staging.'; exit 1
          fi
          if { [ "$BASE" = main ] || [ "$BASE" = master ]; } && [ "$HEAD" != staging ]; then
            echo 'Only staging can be merged into main/master.'; exit 1
          fi

      - name: Checkout
        if: steps.ci-gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.ci-gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.ci-gate.outputs.run == 'true'
        run: npm ci

      - name: Run ESLint
        if: steps.ci-gate.outputs.run == 'true'
        run: npm run lint

      - name: Run tests
        if: steps.ci-gate.outputs.run == 'true'
        env:
          EDA_TEST_ENABLED: 'false'
        run: |
          npm run generate
          node --import tsx --test --test-concurrency=1 --test-reporter=tap --test-reporter-destination=test-results.tap test/*.test.js test/eda-*.test.ts

      - name: Generate both clients and typecheck EDA backend
        if: steps.ci-gate.outputs.run == 'true'
        run: npm run typecheck

      - name: Build EDA API and worker
        if: steps.ci-gate.outputs.run == 'true'
        run: npm run build

      - name: Upload Test Artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.ci-gate.outputs.run == 'true'
        with:
          name: vital-services-test-results
          path: test-results.tap
          retention-days: 7

  eda-integration:
    name: Isolated EDA PostgreSQL and RabbitMQ
    needs: [lint-and-test]
    if: >-
      !cancelled() && needs.lint-and-test.result == 'success' && (needs.lint-and-test.result == 'success' && needs.lint-and-test.outputs.run_ci == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run only the isolated EDA test project
        run: bash docker/eda/run-integration.sh

# Staging pushes publish digest-pinned runtime/tools images to GHCR and deploy
# under the shared staging lock after paired-source and isolated integration checks.

  publish-staging:
    name: Publish VITAL EDA images to GHCR
    needs: [lint-and-test, eda-integration, eda-paired-route-review]
    if: >-
      !cancelled() && needs.lint-and-test.result == 'success' && needs.eda-integration.result == 'success' && needs.eda-paired-route-review.result == 'success' && (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      runtime_digest: ${{ steps.runtime.outputs.digest }}
      tools_digest: ${{ steps.tools.outputs.digest }}
      web_revision: ${{ needs.eda-paired-route-review.outputs.web_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: runtime
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cj-zurc/vital-services:sha-${{ github.sha }}
            ghcr.io/cj-zurc/vital-services:staging
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha,scope=vital-services
          cache-to: type=gha,mode=min,scope=vital-services
      - uses: docker/build-push-action@v5
        id: tools
        with:
          context: .
          file: Dockerfile
          target: tools
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cj-zurc/vital-services-tools:sha-${{ github.sha }}
            ghcr.io/cj-zurc/vital-services-tools:staging
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha,scope=vital-services
          cache-to: type=gha,mode=min,scope=vital-services

  deploy-staging:
    name: Deploy VITAL EDA API and worker to staging
    needs: [publish-staging]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging' &&
      needs.publish-staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
    concurrency:
      group: deploy-vital-staging
      cancel-in-progress: false
    steps:
      - name: Migrate and deploy the exact GHCR digests
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          IMAGE_REF: ghcr.io/cj-zurc/vital-services@${{ needs.publish-staging.outputs.runtime_digest }}
          TOOLS_IMAGE_REF: ghcr.io/cj-zurc/vital-services-tools@${{ needs.publish-staging.outputs.tools_digest }}
          SOURCE_REVISION: ${{ github.sha }}
          WEB_REVISION: ${{ needs.publish-staging.outputs.web_revision }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,IMAGE_REF,TOOLS_IMAGE_REF,SOURCE_REVISION,WEB_REVISION,GHCR_USERNAME,GHCR_READ_TOKEN
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            : "${DEPLOY_PATH:?Missing STAGING_DEPLOY_PATH}"
            [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
            [[ "$WEB_REVISION" =~ ^[a-f0-9]{40}$ ]]
            [[ "$IMAGE_REF" =~ ^ghcr\.io/cj-zurc/vital-services@sha256:[a-f0-9]{64}$ ]]
            [[ "$TOOLS_IMAGE_REF" =~ ^ghcr\.io/cj-zurc/vital-services-tools@sha256:[a-f0-9]{64}$ ]]

            flock /tmp/bgh-staging-deploy.lock bash -lc '
              set -euo pipefail
              cd "$DEPLOY_PATH"
              api_pin_count="$(grep -c "^VITAL_EDA_SERVICES_IMAGE=" .env.compose || true)"
              tools_pin_count="$(grep -c "^VITAL_EDA_TOOLS_IMAGE=" .env.compose || true)"
              test "$api_pin_count" = 1 || { echo "Expected one VITAL_EDA_SERVICES_IMAGE pin" >&2; exit 1; }
              test "$tools_pin_count" = 1 || { echo "Expected one VITAL_EDA_TOOLS_IMAGE pin" >&2; exit 1; }
              previous_api_pin="$(sed -n "s/^VITAL_EDA_SERVICES_IMAGE=//p" .env.compose)"
              previous_tools_pin="$(sed -n "s/^VITAL_EDA_TOOLS_IMAGE=//p" .env.compose)"
              previous_api_container="$(docker compose --env-file .env.compose -f compose.yaml -f compose.staging.yaml ps -q vital-eda-api 2>/dev/null || true)"
              previous_api_id=""
              if [ -n "$previous_api_container" ]; then
                previous_api_id="$(docker inspect --format "{{.Image}}" "$previous_api_container")"
              fi

              echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
              trap "docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
              docker pull "$IMAGE_REF"
              docker pull "$TOOLS_IMAGE_REF"
              sed -i "s|^VITAL_EDA_SERVICES_IMAGE=.*|VITAL_EDA_SERVICES_IMAGE=$IMAGE_REF|" .env.compose
              sed -i "s|^VITAL_EDA_TOOLS_IMAGE=.*|VITAL_EDA_TOOLS_IMAGE=$TOOLS_IMAGE_REF|" .env.compose
              docker compose --env-file .env.compose -f compose.yaml -f compose.staging.yaml config --quiet
              python3 scripts/ecosystem.py vital-start --staging --skip-build
              docker compose --env-file .env.compose -f compose.yaml -f compose.staging.yaml ps vital-eda-api vital-eda-worker

              api_image_id="$(docker image inspect --format "{{.Id}}" "$IMAGE_REF")"
              tools_image_id="$(docker image inspect --format "{{.Id}}" "$TOOLS_IMAGE_REF")"
              mkdir -p .artifacts/releases/vital-ghcr
              umask 077
              printf "{\"sourceRevision\":\"%s\",\"pairedWebRevision\":\"%s\",\"apiWorkerImage\":\"%s\",\"apiWorkerImageId\":\"%s\",\"toolsImage\":\"%s\",\"toolsImageId\":\"%s\",\"previousApiImage\":\"%s\",\"previousToolsImage\":\"%s\",\"previousApiImageId\":\"%s\"}\n" \
                "$SOURCE_REVISION" "$WEB_REVISION" "$IMAGE_REF" "$api_image_id" "$TOOLS_IMAGE_REF" "$tools_image_id" "$previous_api_pin" "$previous_tools_pin" "$previous_api_id" \
                > ".artifacts/releases/vital-ghcr/${SOURCE_REVISION}-services.json"
              printf "Deployed VITAL Services revision %s with paired Web revision %s\n" "$SOURCE_REVISION" "$WEB_REVISION"
            '
