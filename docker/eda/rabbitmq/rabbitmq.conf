listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/secrets/broker-ca.pem
ssl_options.certfile = /run/secrets/broker-cert.pem
ssl_options.keyfile = /run/secrets/broker-key.pem
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
management.tcp.ip = 127.0.0.1
management.tcp.port = 15672
definitions.import_backend = local_filesystem
definitions.local.path = /run/secrets/broker-definitions.json
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 512MB
default_queue_type = quorum
